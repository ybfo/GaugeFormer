[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaugeformer"
version = "0.1.0"
description = "Historical validation for cross-system forecast adaptation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2"]

[tool.setuptools.packages.find]
include = ["gaugeformer*", "backbones*", "experiments*"]

[tool.setuptools.package-data]
backbones = ["vendor/**/*.py", "vendor/**/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
